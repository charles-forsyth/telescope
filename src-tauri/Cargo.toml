[package]
name = "telescope"
version = "0.1.0"
description = "Telescope: a viewer for the Ursa Major Google Cloud projects, powered by Skywalker"
authors = ["Charles Forsyth"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "telescope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
thiserror = "2"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"

[features]
# Demo fixtures for local screenshot QA only. Compiled out of release builds.
demo = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
